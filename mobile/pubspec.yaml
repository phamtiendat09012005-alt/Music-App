name: music_app
description: "Music Player App built with Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # Quản lý phát nhạc & chạy nền (Người 1)
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Giao diện, State, Định tuyến & Mạng (Người 2)
  provider: ^6.1.2
  dio: ^5.4.1
  go_router: ^13.2.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  http: ^1.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true